
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Quest | Grade 8 Vocabulary</title>

<style>
:root {
  --primary:#4f46e5;
  --primary-dark:#4338ca;
  --light:#eef2ff;
  --bg:#f6f7fb;
  --text:#1e293b;
  --muted:#64748b;
  --green:#15803d;
  --red:#dc2626;
  --border:#e2e8f0;
}

* {box-sizing:border-box}

body {
  margin:0;
  font-family:Arial,"Malgun Gothic",sans-serif;
  background:var(--bg);
  color:var(--text);
}

header {
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:20px 16px;
  text-align:center;
}

header h1 {
  margin:0;
  color:var(--primary);
  font-size:28px;
}

header p {
  color:var(--muted);
  margin:8px 0 0;
  font-size:14px;
}

main {
  max-width:850px;
  margin:25px auto;
  padding:0 16px 50px;
}

.progress {
  height:9px;
  background:#e2e8f0;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:22px;
}

.progress div {
  height:100%;
  background:var(--primary);
  width:0%;
  transition:width .3s;
}

.card {
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:26px;
  margin-bottom:18px;
  box-shadow:0 5px 18px #1e293b08;
}

h2 {
  margin-top:0;
  font-size:23px;
}

.subtitle {
  color:var(--muted);
  line-height:1.7;
}

button {
  cursor:pointer;
  font:inherit;
  border-radius:10px;
  padding:12px 18px;
  border:1px solid #cbd5e1;
  background:white;
  color:var(--text);
  transition:.15s;
}

button:hover:not(:disabled) {
  border-color:var(--primary);
  background:var(--light);
}

button:disabled {
  opacity:.65;
  cursor:default;
}

.primary {
  background:var(--primary);
  color:white;
  border-color:var(--primary);
  font-weight:bold;
}

.primary:hover:not(:disabled) {
  background:var(--primary-dark);
  color:white;
}

.secondary {
  background:#f1f5f9;
}

.nav {
  display:flex;
  gap:10px;
  justify-content:space-between;
  flex-wrap:wrap;
  margin-top:22px;
}

.word-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.word-card {
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
}

.word-card strong {
  font-size:18px;
  color:var(--primary);
}

.word-card .meaning {
  font-weight:bold;
  margin:7px 0;
}

.word-card .example {
  font-size:14px;
  color:#475569;
  line-height:1.6;
}

.word-card .translation {
  font-size:12px;
  color:#64748b;
  margin-top:5px;
}

.tag {
  font-size:12px;
  color:var(--primary);
  font-weight:bold;
  margin-bottom:12px;
}

.options {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:18px;
}

.option {
  min-height:52px;
  text-align:center;
}

.correct {
  background:#dcfce7!important;
  border-color:var(--green)!important;
  color:#166534!important;
}

.incorrect {
  background:#fee2e2!important;
  border-color:var(--red)!important;
  color:#991b1b!important;
}

.feedback {
  min-height:28px;
  margin-top:18px;
  font-weight:bold;
  line-height:1.7;
}

.feedback.good {color:var(--green)}
.feedback.bad {color:var(--red)}

.question {
  font-size:21px;
  line-height:1.8;
  font-weight:bold;
  margin:22px 0;
}

.hint {
  background:#fff7ed;
  border-left:4px solid #f59e0b;
  padding:12px;
  margin-top:12px;
  font-size:14px;
  line-height:1.7;
}

input {
  width:100%;
  padding:14px;
  font-size:18px;
  border:1px solid #cbd5e1;
  border-radius:10px;
}

input:focus {
  outline:2px solid #a5b4fc;
}

.score {
  font-size:42px;
  color:var(--primary);
  font-weight:bold;
}

.small {
  font-size:13px;
  color:var(--muted);
}

.pill {
  display:inline-block;
  background:var(--light);
  color:var(--primary);
  padding:6px 12px;
  border-radius:30px;
  font-size:13px;
  font-weight:bold;
}

.center {text-align:center}

/* Activity Images */
.activity-image-wrap {
  display:flex;
  justify-content:center;
  margin:20px auto;
}

.activity-image {
  width:100%;
  max-width:430px;
  max-height:260px;
  object-fit:contain;
  border-radius:14px;
  border:1px solid var(--border);
  background:#f8fafc;
}

.image-caption {
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:-8px;
  margin-bottom:15px;
}

.result-details {
  background:#f8fafc;
  border-radius:12px;
  padding:16px;
  margin:20px 0;
  line-height:1.9;
  text-align:left;
}

@media(max-width:600px) {
  .word-grid,.options {
    grid-template-columns:1fr;
  }

  .card {padding:19px}
  h2 {font-size:21px}
  .question {font-size:19px}
  .activity-image {max-height:230px}
}
</style>
</head>

<body>

<header>
  <h1>📚 Word Quest</h1>
  <p>Grade 8 · Intermediate English Vocabulary</p>
</header>

<main>
  <div class="progress">
    <div id="progressBar"></div>
  </div>

  <div id="app"></div>
</main>

<script>
"use strict";

/* ========================================
   1. VOCABULARY DATA
======================================== */

const vocabulary = [
  {
    word:"achieve",
    meaning:"성취하다",
    example:"She worked hard to achieve her goal.",
    translation:"그녀는 목표를 이루기 위해 열심히 노력했다.",
    hint:"a로 시작하는 동사"
  },
  {
    word:"improve",
    meaning:"향상시키다",
    example:"Reading books can improve your English.",
    translation:"책을 읽으면 영어 실력을 향상시킬 수 있다.",
    hint:"i로 시작하는 동사"
  },
  {
    word:"protect",
    meaning:"보호하다",
    example:"We must protect endangered animals.",
    translation:"우리는 멸종 위기 동물을 보호해야 한다.",
    hint:"p로 시작하는 동사"
  },
  {
    word:"reduce",
    meaning:"줄이다",
    example:"We should reduce plastic waste.",
    translation:"우리는 플라스틱 쓰레기를 줄여야 한다.",
    hint:"r로 시작하는 동사"
  },
  {
    word:"increase",
    meaning:"증가시키다",
    example:"Exercise can increase your energy.",
    translation:"운동은 에너지를 증가시킬 수 있다.",
    hint:"i로 시작하는 동사"
  },
  {
    word:"encourage",
    meaning:"격려하다",
    example:"My teacher encouraged me to try again.",
    translation:"선생님은 다시 도전하도록 나를 격려하셨다.",
    hint:"e로 시작하는 동사"
  },
  {
    word:"discover",
    meaning:"발견하다",
    example:"Scientists discovered a new planet.",
    translation:"과학자들은 새로운 행성을 발견했다.",
    hint:"d로 시작하는 동사"
  },
  {
    word:"develop",
    meaning:"발전시키다",
    example:"Students can develop new skills.",
    translation:"학생들은 새로운 기술을 발전시킬 수 있다.",
    hint:"d로 시작하는 동사"
  },
  {
    word:"prepare",
    meaning:"준비하다",
    example:"I need to prepare for the exam.",
    translation:"나는 시험을 준비해야 한다.",
    hint:"p로 시작하는 동사"
  },
  {
    word:"provide",
    meaning:"제공하다",
    example:"The school provides free lunches.",
    translation:"학교는 무료 점심을 제공한다.",
    hint:"p로 시작하는 동사"
  },
  {
    word:"environment",
    meaning:"환경",
    example:"We should keep our environment clean.",
    translation:"우리는 환경을 깨끗하게 유지해야 한다.",
    hint:"e로 시작하는 명사"
  },
  {
    word:"opportunity",
    meaning:"기회",
    example:"This is a great opportunity to learn.",
    translation:"이것은 배울 수 있는 좋은 기회다.",
    hint:"o로 시작하는 명사"
  },
  {
    word:"experience",
    meaning:"경험",
    example:"Traveling abroad was a wonderful experience.",
    translation:"해외여행은 멋진 경험이었다.",
    hint:"e로 시작하는 명사"
  },
  {
    word:"challenge",
    meaning:"도전",
    example:"Learning a new language is a challenge.",
    translation:"새로운 언어를 배우는 것은 도전이다.",
    hint:"c로 시작하는 명사"
  },
  {
    word:"responsibility",
    meaning:"책임",
    example:"Taking care of a pet is a big responsibility.",
    translation:"반려동물을 돌보는 것은 큰 책임이다.",
    hint:"r로 시작하는 명사"
  },
  {
    word:"confident",
    meaning:"자신감 있는",
    example:"She feels confident about the test.",
    translation:"그녀는 시험에 자신감을 느낀다.",
    hint:"c로 시작하는 형용사"
  },
  {
    word:"necessary",
    meaning:"필요한",
    example:"Water is necessary for life.",
    translation:"물은 생명에 필수적이다.",
    hint:"n으로 시작하는 형용사"
  },
  {
    word:"effective",
    meaning:"효과적인",
    example:"This is an effective way to study.",
    translation:"이것은 효과적인 공부 방법이다.",
    hint:"e로 시작하는 형용사"
  },
  {
    word:"convenient",
    meaning:"편리한",
    example:"Online shopping is convenient.",
    translation:"온라인 쇼핑은 편리하다.",
    hint:"c로 시작하는 형용사"
  },
  {
    word:"valuable",
    meaning:"가치 있는",
    example:"Your advice is very valuable to me.",
    translation:"네 조언은 나에게 매우 가치 있다.",
    hint:"v로 시작하는 형용사"
  }
];

/* ========================================
   2. IMAGE SETTINGS
   assets 폴더의 파일명과 연결
======================================== */

const imageMap = {
  reduce:"assets/reduce.png",
  prepare:"assets/prepare.png",
  protect:"assets/protect.png",
  confident:"assets/confident.png",
  achieve:"assets/achieve.png"
};

const practiceImageWords = [
  "reduce",
  "prepare",
  "protect"
];

const reviewImageWords = [
  "confident",
  "achieve"
];

/* ========================================
   3. STATE
======================================== */

const app = document.getElementById("app");
const bar = document.getElementById("progressBar");

let stage = 0;
let index = 0;
let attempts = 0;
let score = 0;
let finished = false;
let questions = [];
let stageScores = {
  matching:0,
  practiceFill:0,
  reviewMeaning:0,
  reviewSentence:0
};

const STAGE_TOTAL = 5;
const TOTAL_SCORE = 20;

/* ========================================
   4. HELPERS
======================================== */

function shuffle(array) {
  const copy = [...array];

  for(let i=copy.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }

  return copy;
}

function getWord(word) {
  return vocabulary.find(item=>item.word===word);
}

function updateProgress(percent) {
  bar.style.width=percent+"%";
}

function button(label,fn,cls="primary") {
  return `<button class="${cls}" onclick="${fn}">${label}</button>`;
}

function normalize(text) {
  return String(text)
    .toLowerCase()
    .trim()
    .replace(/\s+/g," ")
    .replace(/[.!?]/g,"");
}

function makeOptions(correct,field,count=4) {
  const others=shuffle(
    vocabulary.filter(item=>item[field]!==correct)
  )
  .slice(0,count-1)
  .map(item=>item[field]);

  return shuffle([correct,...others]);
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function imageHTML(word) {
  if(!imageMap[word]) return "";

  return `
    <div class="activity-image-wrap">
      <img
        class="activity-image"
        src="${imageMap[word]}"
        alt="문제 상황을 보여주는 그림"
        onerror="this.parentElement.style.display='none'"
      >
    </div>
    <p class="image-caption">
      그림을 참고하여 문장을 완성하세요.
    </p>
  `;
}

function blankSentence(q) {
  const forms={
    encourage:"encouraged",
    discover:"discovered",
    provide:"provides"
  };

  const target=forms[q.word]||q.word;
  const regex=new RegExp("\\b"+target+"\\b","i");

  return q.example.replace(regex,"________");
}

function resetQuestionState() {
  attempts=0;
  finished=false;
}

function recordScore(category) {
  if(attempts===0) {
    score++;
    stageScores[category]++;
  }
}

function finishQuestion() {
  finished=true;

  document.querySelectorAll(".option").forEach(btn=>{
    btn.disabled=true;
  });

  const nextArea=document.getElementById("nextArea");

  if(nextArea) {
    nextArea.innerHTML=`
      <div class="nav">
        <span></span>
        ${button(
          index===questions.length-1
            ?"다음 활동 →"
            :"다음 문제 →",
          "nextQuestion()"
        )}
      </div>
    `;
  }
}

function finishInput() {
  finished=true;

  const input=document.getElementById("answer");
  const submit=document.getElementById("submitBtn");

  input.disabled=true;
  submit.disabled=true;

  document.getElementById("nextArea").innerHTML=`
    <div class="nav">
      <span></span>
      ${button(
        index===questions.length-1
          ?"다음 활동 →"
          :"다음 문제 →",
        "nextQuestion()"
      )}
    </div>
  `;
}

function nextQuestion() {
  index++;
  resetQuestionState();
  render();
}

/* ========================================
   5. MAIN RENDER
======================================== */

function render() {
  window.scrollTo(0,0);

  if(stage===0) home();
  else if(stage===1) learn();
  else if(stage===2) matching();
  else if(stage===3) practiceFill();
  else if(stage===4) reviewMeaning();
  else if(stage===5) reviewSentence();
  else if(stage===6) results();
}

/* ========================================
   6. HOME
======================================== */

function home() {
  updateProgress(0);

  app.innerHTML=`
    <div class="card center">
      <div style="font-size:54px">🚀</div>

      <h2>Welcome to Word Quest!</h2>

      <p class="subtitle">
        중학교 2학년 영어 단어 20개를<br>
        예문과 함께 익히고 연습해 보세요.
      </p>

      <p><span class="pill">⏱ 약 5~10분</span></p>

      <div style="
        text-align:left;
        max-width:420px;
        margin:25px auto;
        line-height:2.2;
      ">
        📖 Step 1. Learn — 단어와 예문 학습<br>
        🧩 Step 2. Practice — 매칭과 이미지 빈칸 채우기<br>
        ✏️ Step 3. Review — 직접 답 입력하기
      </div>

      <p class="small">
        틀리면 힌트를 보고 한 번 더 도전할 수 있어요.<br>
        점수는 첫 번째 시도 기준으로 계산됩니다.
      </p>

      ${button("학습 시작하기 →","start()")}
    </div>
  `;
}

function start() {
  stage=1;
  index=0;
  score=0;
  resetQuestionState();

  stageScores={
    matching:0,
    practiceFill:0,
    reviewMeaning:0,
    reviewSentence:0
  };

  render();
}

/* ========================================
   7. LEARN
======================================== */

function learn() {
  updateProgress(index===0?10:20);

  const startIdx=index*10;
  const words=vocabulary.slice(startIdx,startIdx+10);

  app.innerHTML=`
    <div class="card">
      <div class="tag">
        STEP 1 · LEARN (${index+1}/2)
      </div>

      <h2>📖 단어와 예문 익히기</h2>

      <p class="subtitle">
        영어 단어와 한국어 뜻을 확인하고,
        예문 속에서 어떻게 사용되는지 살펴보세요.
      </p>

      <div class="word-grid">
        ${words.map((w,i)=>`
          <div class="word-card">
            <strong>${startIdx+i+1}. ${w.word}</strong>

            <div class="meaning">${w.meaning}</div>

            <div class="example">${w.example}</div>

            <div class="translation">${w.translation}</div>
          </div>
        `).join("")}
      </div>

      <div class="nav">
        ${
          index===1
          ?button("← 이전 단어","index=0;render()","secondary")
          :"<span></span>"
        }

        ${
          index===0
          ?button("다음 단어 10개 →","index=1;render()")
          :button("연습 시작하기 →","setupMatching()")
        }
      </div>
    </div>
  `;
}

/* ========================================
   8. PRACTICE 1: MATCHING
======================================== */

function setupMatching() {
  stage=2;
  index=0;
  resetQuestionState();

  questions=shuffle(vocabulary)
    .slice(0,STAGE_TOTAL)
    .map(q=>({
      ...q,
      options:makeOptions(q.meaning,"meaning")
    }));

  render();
}

function matching() {
  updateProgress(35);

  const q=questions[index];

  if(!q) {
    setupPracticeFill();
    return;
  }

  app.innerHTML=`
    <div class="card">
      <div class="tag">STEP 2 · PRACTICE 1</div>

      <h2>🧩 뜻 매칭하기</h2>

      <p class="subtitle">
        영어 단어에 알맞은 한국어 뜻을 선택하세요.
      </p>

      <p class="small">
        문제 ${index+1} / ${questions.length}
      </p>

      <div class="question center">${q.word}</div>

      <div class="options">
        ${q.options.map((option,i)=>`
          <button
            class="option"
            id="opt${i}"
            onclick="checkMatching(${i})"
          >${option}</button>
        `).join("")}
      </div>

      <div id="feedback" class="feedback"></div>
      <div id="hintBox"></div>
      <div id="nextArea"></div>
    </div>
  `;
}

function checkMatching(i) {
  if(finished)return;

  const q=questions[index];
  const value=q.options[i];
  const fb=document.getElementById("feedback");
  const hb=document.getElementById("hintBox");
  const btn=document.getElementById("opt"+i);

  if(value===q.meaning) {
    recordScore("matching");

    fb.textContent="정답이에요! 🎉";
    fb.className="feedback good";

    btn.classList.add("correct");
    finishQuestion();
  } else {
    attempts++;

    btn.classList.add("incorrect");
    btn.disabled=true;

    fb.className="feedback bad";

    if(attempts===1) {
      fb.textContent="다시 한 번 도전해 보세요!";

      hb.innerHTML=`
        <div class="hint">
          💡 힌트: ${q.example}<br>
          ${q.translation}
        </div>
      `;
    } else {
      fb.textContent=`정답은 "${q.meaning}"입니다.`;
      finishQuestion();
    }
  }
}

/* ========================================
   9. PRACTICE 2: IMAGE + CLICK
======================================== */

function setupPracticeFill() {
  stage=3;
  index=0;
  resetQuestionState();

  const fixed=practiceImageWords.map(getWord);

  const others=shuffle(
    vocabulary.filter(
      w=>!practiceImageWords.includes(w.word)
    )
  ).slice(0,2);

  questions=shuffle([...fixed,...others]).map(q=>({
    ...q,
    options:makeOptions(q.word,"word")
  }));

  render();
}

function practiceFill() {
  updateProgress(55);

  const q=questions[index];

  if(!q) {
    setupReviewMeaning();
    return;
  }

  app.innerHTML=`
    <div class="card">
      <div class="tag">STEP 2 · PRACTICE 2</div>

      <h2>🖼️ 문장 완성하기</h2>

      <p class="subtitle">
        문장을 읽고 빈칸에 알맞은 단어를 클릭하세요.
        그림이 있다면 함께 참고하세요.
      </p>

      <p class="small">
        문제 ${index+1} / ${questions.length}
      </p>

      ${imageHTML(q.word)}

      <div class="question">
        ${blankSentence(q)}
      </div>

      <div class="options">
        ${q.options.map((option,i)=>`
          <button
            class="option"
            id="opt${i}"
            onclick="checkPracticeFill(${i})"
          >${option}</button>
        `).join("")}
      </div>

      <div id="feedback" class="feedback"></div>
      <div id="hintBox"></div>
      <div id="nextArea"></div>
    </div>
  `;
}

function checkPracticeFill(i) {
  if(finished)return;

  const q=questions[index];
  const value=q.options[i];

  const fb=document.getElementById("feedback");
  const hb=document.getElementById("hintBox");
  const btn=document.getElementById("opt"+i);

  if(value===q.word) {
    recordScore("practiceFill");

    fb.textContent="정답이에요! 🎉 "+q.example;
    fb.className="feedback good";

    btn.classList.add("correct");
    finishQuestion();
  } else {
    attempts++;

    btn.disabled=true;
    btn.classList.add("incorrect");

    fb.className="feedback bad";

    if(attempts===1) {
      fb.textContent="힌트를 보고 다시 선택하세요.";

      hb.innerHTML=`
        <div class="hint">
          💡 힌트: 정답 단어의 뜻은
          "${q.meaning}"입니다.
        </div>
      `;
    } else {
      fb.textContent=`정답: ${q.word} — ${q.example}`;
      finishQuestion();
    }
  }
}

/* ========================================
   10. REVIEW QUIZ 1: MEANING
======================================== */

const koreanAlternatives={
  achieve:["달성하다","이루다"],
  improve:["개선하다","향상하다"],
  protect:["지키다"],
  reduce:["감소시키다"],
  increase:["늘리다","증가하다"],
  encourage:["용기를 주다","장려하다"],
  discover:["찾아내다"],
  develop:["개발하다","발달시키다"],
  prepare:["대비하다"],
  provide:["공급하다"],
  environment:["주변 환경"],
  opportunity:["좋은 기회"],
  experience:["체험"],
  challenge:["도전 과제"],
  responsibility:["책임감"],
  confident:["확신하는","자신 있는"],
  necessary:["필수적인"],
  effective:["효율적인"],
  convenient:["간편한"],
  valuable:["소중한","귀중한"]
};

function setupReviewMeaning() {
  stage=4;
  index=0;
  resetQuestionState();

  questions=shuffle(vocabulary)
    .slice(0,STAGE_TOTAL)
    .map((q,i)=>({
      ...q,
      direction:i%2===0?"enToKo":"koToEn"
    }));

  render();
}

function reviewMeaning() {
  updateProgress(75);

  const q=questions[index];

  if(!q) {
    setupReviewSentence();
    return;
  }

  const en=q.direction==="enToKo";

  app.innerHTML=`
    <div class="card">
      <div class="tag">STEP 3 · REVIEW QUIZ 1</div>

      <h2>✏️ 단어 뜻 직접 쓰기</h2>

      <p class="subtitle">
        ${
          en
          ?"영어 단어의 한국어 뜻을 입력하세요."
          :"한국어 뜻에 해당하는 영어 단어를 입력하세요."
        }
      </p>

      <p class="small">
        문제 ${index+1} / ${questions.length}
      </p>

      <div class="question center">
        ${en?q.word:q.meaning}
      </div>

      <form onsubmit="checkReviewMeaning(event)">
        <input
          id="answer"
          autocomplete="off"
          placeholder="정답 입력"
          required
        >

        <div class="nav">
          <span></span>
          <button
            class="primary"
            type="submit"
            id="submitBtn"
          >정답 확인</button>
        </div>
      </form>

      <div id="feedback" class="feedback"></div>
      <div id="hintBox"></div>
      <div id="nextArea"></div>
    </div>
  `;
}

function checkReviewMeaning(e) {
  e.preventDefault();

  if(finished)return;

  const q=questions[index];
  const en=q.direction==="enToKo";

  const value=normalize(
    document.getElementById("answer").value
  );

  const answer=en?q.meaning:q.word;

  const acceptable=en
    ?[q.meaning,...(koreanAlternatives[q.word]||[])]
    :[q.word];

  const fb=document.getElementById("feedback");
  const hb=document.getElementById("hintBox");

  if(acceptable.some(a=>normalize(a)===value)) {
    recordScore("reviewMeaning");

    fb.textContent="정답이에요! 🎉";
    fb.className="feedback good";

    finishInput();
  } else {
    attempts++;
    fb.className="feedback bad";

    if(attempts===1) {
      fb.textContent="다시 한 번 입력해 보세요.";

      hb.innerHTML=`
        <div class="hint">
          💡 힌트:
          ${en?q.translation:q.hint}
        </div>
      `;

      document.getElementById("answer").value="";
      document.getElementById("answer").focus();
    } else {
      fb.textContent=`정답: ${answer}`;
      finishInput();
    }
  }
}

/* ========================================
   11. REVIEW QUIZ 2: IMAGE + WRITING
======================================== */

function setupReviewSentence() {
  stage=5;
  index=0;
  resetQuestionState();

  const fixed=reviewImageWords.map(getWord);

  const others=shuffle(
    vocabulary.filter(w=>
      !reviewImageWords.includes(w.word) &&
      !["encourage","discover","provide"].includes(w.word)
    )
  ).slice(0,3);

  questions=shuffle([...fixed,...others]);

  render();
}

function reviewSentence() {
  updateProgress(90);

  const q=questions[index];

  if(!q) {
    finishAll();
    return;
  }

  app.innerHTML=`
    <div class="card">
      <div class="tag">STEP 3 · REVIEW QUIZ 2</div>

      <h2>🎯 빈칸에 단어 쓰기</h2>

      <p class="subtitle">
        문장을 읽고 알맞은 영어 단어를 직접 입력하세요.
        그림이 있다면 함께 참고하세요.
      </p>

      <p class="small">
        문제 ${index+1} / ${questions.length}
      </p>

      ${imageHTML(q.word)}

      <div class="question">
        ${blankSentence(q)}
      </div>

      <form onsubmit="checkReviewSentence(event)">
        <input
          id="answer"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="영어 단어 입력"
          required
        >

        <div class="nav">
          <span></span>

          <button
            class="primary"
            type="submit"
            id="submitBtn"
          >정답 확인</button>
        </div>
      </form>

      <div id="feedback" class="feedback"></div>
      <div id="hintBox"></div>
      <div id="nextArea"></div>
    </div>
  `;
}

function checkReviewSentence(e) {
  e.preventDefault();

  if(finished)return;

  const q=questions[index];

  const value=normalize(
    document.getElementById("answer").value
  );

  const fb=document.getElementById("feedback");
  const hb=document.getElementById("hintBox");

  if(value===q.word) {
    recordScore("reviewSentence");

    fb.textContent="정답이에요! 🎉 "+q.example;
    fb.className="feedback good";

    finishInput();
  } else {
    attempts++;
    fb.className="feedback bad";

    if(attempts===1) {
      fb.textContent="힌트를 보고 한 번 더 도전하세요!";

      hb.innerHTML=`
        <div class="hint">
          💡 뜻: ${q.meaning}<br>
          첫 글자: ${q.word[0].toUpperCase()}
        </div>
      `;

      document.getElementById("answer").value="";
      document.getElementById("answer").focus();
    } else {
      fb.textContent=`정답: ${q.word} — ${q.example}`;
      finishInput();
    }
  }
}

/* ========================================
   12. RESULTS
======================================== */

function finishAll() {
  stage=6;
  render();
}

function results() {
  updateProgress(100);

  const percent=Math.round(score/TOTAL_SCORE*100);

  const message=
    percent>=85
    ?"Excellent work! 🌟"
    :percent>=60
    ?"Good job! 👍"
    :"Keep practicing! 💪";

  app.innerHTML=`
    <div class="card center">
      <div style="font-size:55px">🏆</div>

      <h2>학습 완료!</h2>

      <p class="subtitle">
        모든 활동을 마쳤어요.<br>
        학습 결과를 확인해 보세요.
      </p>

      <div class="score">
        ${score} / ${TOTAL_SCORE}
      </div>

      <p class="pill">
        ${percent}% · 첫 번째 시도 기준
      </p>

      <h3 style="margin-top:24px">
        ${message}
      </h3>

      <div class="result-details">
        <strong>📊 활동별 결과</strong><br>
        🧩 뜻 매칭하기:
        ${stageScores.matching}/5<br>

        🖼️ 문장 완성하기:
        ${stageScores.practiceFill}/5<br>

        ✏️ 단어 뜻 직접 쓰기:
        ${stageScores.reviewMeaning}/5<br>

        🎯 빈칸에 단어 쓰기:
        ${stageScores.reviewSentence}/5
      </div>

      <p class="subtitle">
        틀린 단어는 다시 학습하고 도전해 보세요!
      </p>

      <div class="nav">
        ${button(
          "처음부터 다시 하기",
          "resetApp()",
          "secondary"
        )}

        ${button(
          "단어 다시 공부하기",
          "stage=1;index=0;render()"
        )}
      </div>
    </div>
  `;
}

function resetApp() {
  stage=0;
  index=0;
  score=0;
  resetQuestionState();
  render();
}

/* ========================================
   INITIALIZE
======================================== */

render();

</script>
</body>
</html>
